name: Validate and package TES Borovets

on:
  push:
    branches:
      - exely-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate and build
        run: npm run build

      - name: Upload verified website package
        uses: actions/upload-artifact@v7
        with:
          name: tes-borovets-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

